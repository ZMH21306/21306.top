<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="语文5组的神秘报纸——版本索引（横版A4）">
    <title>语文5组的神秘报纸 · 索引 | 21306.top/np</title>
    <style>
        /* ============================================================
           一、全局重置与设计变量
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --ink: #16130f;
            --ink-soft: #3c3730;
            --paper: #faf7ef;
            --rule: #c9c2b0;
            --rule-dark: #16130f;
            --muted: #6d675a;
            --red: #a3211e;

            --font-body: Georgia, "Nimbus Roman", "SimSun", "宋体", "Songti SC", serif;
            --font-title: "Times New Roman", "SimHei", "黑体", "Heiti SC", sans-serif;
            --font-sub: "KaiTi", "楷体", "STKaiti", serif;
        }

        html {
            background: #d8d3c8;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            font-family: var(--font-body);
            background: #d8d3c8;
            color: var(--ink);
            margin: 0;
            padding: 0;
        }

        /* ============================================================
           二、外层容器（负责裁剪与占位）
           ============================================================ */
        .paper-outer {
            width: 100%;
            overflow: hidden;
            position: relative;
            background: #d8d3c8;
        }

        /* ============================================================
           三、纸张本体（297mm × 210mm，由 JS 等比缩放）
           ============================================================ */
        .sheet {
            width: 297mm;
            height: 210mm;
            padding: 3mm 4mm 2mm;
            background: var(--paper);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transform-origin: top left;
            will-change: transform;
        }

        .sheet::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.02'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        /* ============================================================
           四、报头
           ============================================================ */
        .masthead {
            height: 12mm;
            display: flex;
            align-items: center;
            padding: 0 4mm;
            border-bottom: 1px solid var(--rule-dark);
            position: relative;
            z-index: 2;
            flex-shrink: 0;
        }

        .masthead::before {
            content: "";
            position: absolute;
            inset: 0;
            border-top: 3mm solid var(--red);
            z-index: -1;
        }

        .masthead-content {
            display: flex;
            align-items: center;
            width: 100%;
        }

        .masthead-logo {
            font-size: 5mm;
            font-weight: bold;
            color: var(--red);
            letter-spacing: -0.5px;
            margin-right: 8mm;
            font-family: var(--font-title);
        }

        .masthead-title {
            font-size: 4mm;
            font-weight: bold;
            color: var(--ink);
            flex-grow: 1;
            margin-right: 4mm;
            font-family: var(--font-title);
        }

        .masthead-date {
            font-size: 2.5mm;
            color: var(--ink-soft);
            white-space: nowrap;
            font-family: var(--font-body);
        }

        /* ============================================================
           五、版心（可滚动区域）
           ============================================================ */
        .main {
            flex: 1 1 auto;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 2mm;
            position: relative;
            min-height: 0;
        }

        .index-wrap {
            max-width: 280mm;
            margin: 0 auto;
            padding: 6mm 4mm;
        }

        .index-kicker {
            text-align: center;
            font-family: var(--font-sub);
            color: var(--red);
            font-size: 3.2mm;
            letter-spacing: 0.5mm;
            margin-bottom: 2mm;
        }

        .index-title {
            text-align: center;
            font-family: var(--font-title);
            font-size: 9mm;
            font-weight: bold;
            color: var(--ink);
            letter-spacing: -0.5px;
            margin-bottom: 3mm;
        }

        .index-sub {
            text-align: center;
            font-family: var(--font-sub);
            color: var(--ink-soft);
            font-size: 3mm;
            margin-bottom: 6mm;
        }

        /* ============================================================
           六、版本卡片
           ============================================================ */
        .version-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4mm;
        }

        .version-card {
            background: var(--paper);
            border: 1px solid var(--rule);
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
        }

        .version-card:hover {
            transform: translateY(-1mm);
            box-shadow: 0 2mm 4mm rgba(0, 0, 0, 0.12);
            border-color: var(--rule-dark);
        }

        .card-head {
            background: var(--red);
            color: #fff;
            padding: 2mm 3mm;
            font-size: 3.2mm;
            font-weight: bold;
            text-align: center;
            font-family: var(--font-title);
        }

        .card-body {
            padding: 3mm;
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
        }

        .card-name {
            font-size: 3mm;
            font-weight: bold;
            color: var(--ink);
            margin-bottom: 1mm;
        }

        .card-desc {
            font-size: 2.4mm;
            color: var(--ink-soft);
            line-height: 1.5;
            margin-bottom: 3mm;
        }

        .card-cta {
            margin-top: auto;
            display: inline-block;
            padding: 1.5mm 3mm;
            background: var(--red);
            color: #fff;
            font-size: 2.4mm;
            text-align: center;
            font-family: var(--font-body);
        }

        .version-card:hover .card-head {
            background: #8b1a18;
        }

        /* ============================================================
           七、页脚
           ============================================================ */
        .footer {
            flex-shrink: 0;
            border-top: 1px solid var(--rule-dark);
            padding: 2mm 4mm;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 2.2mm;
            color: var(--ink);
            font-family: var(--font-body);
            position: relative;
            z-index: 2;
        }

        .footer span + span {
            margin-left: 6mm;
        }
    </style>
</head>
<body>
    <div class="paper-outer" id="paper-outer">

            <main class="main">
                <div class="index-wrap">
                    <div class="index-kicker">— 校园日报 · 特制索引 —</div>
                    <h1 class="index-title">语文5组的神秘报纸</h1>

                            <div class="card-body">

            <footer class="footer">

    </div>
    <script>
        (function () {
            var sheet = document.getElementById('paper-sheet');
            var outer = document.getElementById('paper-outer');
            if (!sheet || !outer) return;

            var naturalW = 0;      // 纸张未缩放时的实际像素宽
            var naturalH = 0;
            var lastWidth = -1;
            var rafId = null;

            // 只在初始化时测量一次原始尺寸（此时先摘掉 transform，避免量到缩放后的值）
            function measure() {
                var prev = sheet.style.transform;
                sheet.style.transform = 'none';
                var rect = sheet.getBoundingClientRect();
                sheet.style.transform = prev;

                naturalW = rect.width || (297 * 96 / 25.4);
                naturalH = rect.height || (210 * 96 / 25.4);
            }

            function applyZoom() {
                var vw = document.documentElement.clientWidth || window.innerWidth;
                if (!vw) return;
                if (vw === lastWidth) return;
                lastWidth = vw;

                if (!naturalW || !naturalH) measure();

                var scale = vw / naturalW;
                sheet.style.transform = 'scale(' + scale + ')';
                outer.style.height = (naturalH * scale) + 'px';
            }

            function scheduleFit() {
                if (rafId) return;
                rafId = requestAnimationFrame(function () {
                    rafId = null;
                    applyZoom();
                });
            }

            window.addEventListener('resize', scheduleFit);
            window.addEventListener('orientationchange', scheduleFit);

            applyZoom();

            // 字体加载完成后重算一次，避免尺寸偏差
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(function () {
                    lastWidth = -1;
                    applyZoom();
                });
            }
        })();
    </script>

</html>
