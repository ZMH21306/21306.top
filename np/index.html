<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="语文5组的神秘报纸——版本索引">
    <meta name="theme-color" content="#d8d3c8">
    <title>语文5组的神秘报纸 · 索引 | 21306.top/np</title>

    <style>
        /* ============================================================
           一、全局重置 + 设计变量
           ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --ink: #16130f;
            --ink-soft: #3c3730;
            --paper: #faf7ef;
            --rule: #c9c2b0;
            --rule-dark: #16130f;
            --red: #a3211e;
            --stage: #d8d3c8;

            --font-body: Georgia, "Nimbus Roman", "SimSun", "宋体", "Songti SC", serif;
            --font-title: "Times New Roman", "SimHei", "黑体", "Heiti SC", sans-serif;
            --font-sub: "KaiTi", "楷体", "STKaiti", serif;
        }

        /* ============================================================
           二、页面基底
           ============================================================ */
        html {
            height: 100%;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: clamp(6px, 1.2vw, 20px);
            background: var(--stage);
            color: var(--ink);
            font-family: var(--font-body);
            font-size: 16px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* ============================================================
           三、纸张容器
           ============================================================ */
        .page {
            position: relative;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1180px;
            flex: 1 1 auto;
            min-height: 0;
            background: var(--paper);
            box-shadow:
                0 1px 2px rgba(22, 19, 15, 0.04),
                0 12px 32px -10px rgba(22, 19, 15, 0.18);
            overflow: hidden;
            isolation: isolate;
        }

        .page::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.02'/%3E%3C/svg%3E");
        }

        /* ============================================================
           四、报头
           ============================================================ */
        .masthead {
            position: relative;
            z-index: 2;
            flex-shrink: 0;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            gap: 4px clamp(12px, 2vw, 24px);
            padding: clamp(12px, 1.8vw, 20px) clamp(16px, 3vw, 40px);
            border-top: clamp(5px, 0.8vw, 9px) solid var(--red);
            border-bottom: 1px solid var(--rule-dark);
        }

        .masthead-title {
            flex: 1 1 auto;
            min-width: 0;
            font-family: var(--font-title);
            font-weight: 700;
            font-size: clamp(15px, 1.8vw, 21px);
            line-height: 1.25;
            letter-spacing: -0.01em;
            color: var(--ink);
            overflow-wrap: break-word;
        }

        .masthead-date {
            flex: 0 0 auto;
            margin-left: auto;
            font-family: var(--font-body);
            font-size: clamp(11px, 1.15vw, 14px);
            line-height: 1.3;
            color: var(--ink-soft);
            white-space: nowrap;
        }

        /* ============================================================
           五、版心
           ============================================================ */
        .main {
            position: relative;
            z-index: 1;
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            padding: clamp(24px, 5vw, 64px) clamp(16px, 3.5vw, 48px);
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        .index-wrap {
            width: 100%;
            max-width: 1040px;
            margin: auto;
        }

        /* 主标题 */
        .index-title {
            text-align: center;
            font-family: var(--font-title);
            font-weight: 700;
            font-size: clamp(22px, 4.2vw, 48px);
            line-height: 1.15;
            letter-spacing: -0.02em;
            color: var(--ink);
            margin-bottom: clamp(8px, 1.2vw, 16px);
            overflow-wrap: break-word;
        }

        /* 副标题 */
        .index-sub {
            text-align: center;
            font-family: var(--font-sub);
            font-size: clamp(12px, 1.4vw, 17px);
            line-height: 1.55;
            color: var(--ink-soft);
            margin-bottom: clamp(22px, 4vw, 44px);
        }

        /* ============================================================
           六、版本卡片网格（移动端单列，≥700px 三列）
           ============================================================ */
        .version-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: clamp(14px, 2vw, 22px);
        }

        @media (min-width: 700px) {
            .version-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        /* 卡片主体：白底 + 细边框，红色只作点缀 */
        .version-card {
            display: flex;
            flex-direction: column;
            background: var(--paper);
            border: 1px solid var(--rule);
            color: inherit;
            text-decoration: none;
            transition:
                transform 0.25s cubic-bezier(0.2, 0, 0, 1),
                box-shadow 0.25s cubic-bezier(0.2, 0, 0, 1),
                border-color 0.25s ease;
        }

        /* 卡片头部：左侧红色竖条 + 深色文字 */
        .card-head {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: clamp(12px, 1.4vw, 16px) clamp(16px, 1.8vw, 22px);
            border-bottom: 1px solid var(--rule);
            font-family: var(--font-title);
            font-weight: 700;
            font-size: clamp(13px, 1.3vw, 16px);
            letter-spacing: 0.1em;
            color: var(--ink);
        }

        .card-head::before {
            content: "";
            flex-shrink: 0;
            width: 3px;
            height: 1em;
            background: var(--red);
        }

        .card-body {
            display: flex;
            flex-direction: column;
            gap: clamp(6px, 0.8vw, 10px);
            padding: clamp(16px, 1.8vw, 22px);
            flex: 1 1 auto;
        }

        .card-name {
            font-weight: 700;
            font-size: clamp(14px, 1.35vw, 17px);
            line-height: 1.4;
            color: var(--ink);
            overflow-wrap: break-word;
        }

        .card-desc {
            font-size: clamp(12px, 1.2vw, 14px);
            line-height: 1.6;
            color: var(--ink-soft);
            overflow-wrap: break-word;
        }

        /* 卡片底部：纯文字 CTA，带箭头位移微动效 */
        .card-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: clamp(12px, 1.4vw, 16px) clamp(16px, 1.8vw, 22px);
            border-top: 1px solid var(--rule);
            font-size: clamp(12px, 1.2vw, 14px);
            font-weight: 700;
            letter-spacing: 0.06em;
            color: var(--red);
        }

        .card-arrow {
            display: inline-block;
            transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1);
        }

        /* 悬停效果：仅在有真实指针的设备上启用 */
        @media (hover: hover) and (pointer: fine) {
            .version-card:hover {
                transform: translateY(-3px);
                box-shadow: 0 14px 28px -10px rgba(22, 19, 15, 0.18);
                border-color: var(--rule-dark);
            }
            .version-card:hover .card-arrow {
                transform: translateX(4px);
            }
        }

        .version-card:focus-visible {
            outline: 2px solid var(--red);
            outline-offset: 3px;
        }

        /* ============================================================
           七、页脚
           ============================================================ */
        .footer {
            position: relative;
            z-index: 2;
            flex-shrink: 0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 6px clamp(12px, 2vw, 24px);
            padding: clamp(12px, 1.4vw, 18px) clamp(16px, 3vw, 40px);
            border-top: 1px solid var(--rule-dark);
            font-size: clamp(11px, 1.1vw, 13px);
            color: var(--ink);
        }

        /* ============================================================
           八、减少动态效果
           ============================================================ */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
            .version-card:hover {
                transform: none;
            }
            .version-card:hover .card-arrow {
                transform: none;
            }
        }
    </style>
</head>
