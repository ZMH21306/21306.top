<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="语文5组的神秘报纸——版本索引">
    <meta name="theme-color" content="#d8d3c8">
    <title>语文5组的神秘报纸 · 索引 | 21306.top/np</title>

    <style>
        /* ============================================================
           一、重置 + 设计变量
           ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* 色彩 */
            --ink: #16130f;
            --ink-soft: #3c3730;
            --paper: #faf7ef;
            --rule: #c9c2b0;
            --rule-dark: #16130f;
            --red: #a3211e;
            --red-dark: #8b1a18;
            --stage: #d8d3c8;

            /* 字体 */
            --font-body: Georgia, "Nimbus Roman", "SimSun", "宋体", "Songti SC", serif;
            --font-title: "Times New Roman", "SimHei", "黑体", "Heiti SC", sans-serif;
            --font-sub: "KaiTi", "楷体", "STKaiti", serif;

            /* 间距 */
            --gap-outer: clamp(8px, 1.5vw, 24px);
            --gap-card: clamp(12px, 1.8vw, 22px);
        }

        /* ============================================================
           二、页面基底
           ============================================================ */
        html {
            height: 100%;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            justify-items: center;
            align-items: start;
            padding: var(--gap-outer);
            background: var(--stage);
            color: var(--ink);
            font-family: var(--font-body);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            -webkit-tap-highlight-color: transparent;
        }

        /* ============================================================
           三、纸张容器（弹性适应任意宽高）
           ============================================================ */
        .page {
            position: relative;
            width: 100%;
            max-width: 1280px;
            min-height: calc(100vh - 2 * var(--gap-outer));
            min-height: calc(100dvh - 2 * var(--gap-outer));
            display: flex;
            flex-direction: column;
            background: var(--paper);
            box-shadow:
                0 1px 2px rgba(22, 19, 15, 0.04),
                0 12px 32px -10px rgba(22, 19, 15, 0.18);
            overflow: hidden;
            isolation: isolate;
        }

        /* 纸张噪点纹理 */
        .page::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.02'/%3E%3C/svg%3E");
        }

        /* ============================================================
           四、报头
           ============================================================ */
        .masthead {
            position: relative;
            z-index: 2;
            flex-shrink: 0;
            min-height: clamp(48px, 7vh, 76px);
            display: flex;
            align-items: center;
            padding: 0 clamp(16px, 3vw, 36px);
            border-top: clamp(6px, 1vw, 11px) solid var(--red);
            border-bottom: 1px solid var(--rule-dark);
        }

        .masthead-content {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: clamp(6px, 1.2vw, 20px);
            width: 100%;
        }

        .masthead-logo {
            flex-shrink: 0;
            font-family: var(--font-title);
            font-weight: 700;
            font-size: clamp(20px, 2.8vw, 32px);
            line-height: 1;
            color: var(--red);
            letter-spacing: -0.02em;
        }

        .masthead-title {
            flex: 1 1 auto;
            font-family: var(--font-title);
            font-weight: 700;
            font-size: clamp(14px, 1.8vw, 22px);
            line-height: 1.25;
            color: var(--ink);
            letter-spacing: -0.01em;
        }

        .masthead-date {
            flex-shrink: 0;
            font-family: var(--font-body);
            font-size: clamp(11px, 1.1vw, 14px);
            line-height: 1.2;
            color: var(--ink-soft);
            white-space: nowrap;
        }

        /* ============================================================
           五、版心
           ============================================================ */
        .main {
            position: relative;
            z-index: 1;
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: clamp(20px, 4.5vh, 48px) clamp(16px, 3.5vw, 48px);
        }

        .index-wrap {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* 引导语 */
        .index-kicker {
            text-align: center;
            font-family: var(--font-sub);
            font-size: clamp(12px, 1.4vw, 16px);
            letter-spacing: 0.18em;
            color: var(--red);
            margin-bottom: clamp(8px, 1.2vw, 16px);
        }

        /* 主标题 */
        .index-title {
            text-align: center;
            font-family: var(--font-title);
            font-weight: 700;
            font-size: clamp(26px, 4.5vw, 54px);
            line-height: 1.15;
            letter-spacing: -0.02em;
            color: var(--ink);
            margin-bottom: clamp(8px, 1.2vw, 18px);
        }

        /* 副标题 */
        .index-sub {
            text-align: center;
            font-family: var(--font-sub);
            font-size: clamp(13px, 1.5vw, 18px);
            line-height: 1.5;
            color: var(--ink-soft);
            margin-bottom: clamp(24px, 4vw, 48px);
        }

        /* ============================================================
           六、版本卡片
           ============================================================ */
        .version-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--gap-card);
        }

        @media (min-width: 760px) {
            .version-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        .version-card {
            display: flex;
            flex-direction: column;
            background: var(--paper);
            border: 1px solid var(--rule);
            color: inherit;
            text-decoration: none;
            transition:
                transform 0.22s cubic-bezier(0.2, 0, 0, 1),
                box-shadow 0.22s cubic-bezier(0.2, 0, 0, 1),
                border-color 0.22s ease;
        }

        .version-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 26px -8px rgba(22, 19, 15, 0.2);
            border-color: var(--rule-dark);
        }

        .version-card:focus-visible {
            outline: 2px solid var(--red);
            outline-offset: 3px;
        }

        .card-head {
            background: var(--red);
            color: #ffffff;
            padding: clamp(10px, 1.1vw, 15px) clamp(14px, 1.6vw, 20px);
            font-family: var(--font-title);
            font-weight: 700;
            font-size: clamp(14px, 1.5vw, 18px);
            text-align: center;
            letter-spacing: 0.06em;
            transition: background-color 0.22s ease;
        }

        .version-card:hover .card-head {
            background: var(--red-dark);
        }

        .card-body {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            gap: clamp(4px, 0.6vw, 8px);
            padding: clamp(16px, 1.8vw, 24px);
        }

        .card-name {
            font-family: var(--font-body);
            font-weight: 700;
            font-size: clamp(14px, 1.4vw, 18px);
            line-height: 1.35;
            color: var(--ink);
        }

        .card-desc {
            font-family: var(--font-body);
            font-size: clamp(12px, 1.2vw, 15px);
            line-height: 1.6;
            color: var(--ink-soft);
        }

        .card-cta {
            margin-top: auto;
            align-self: stretch;
            display: block;
            padding: clamp(9px, 1vw, 12px) clamp(14px, 1.5vw, 20px);
            background: var(--red);
            color: #ffffff;
            font-family: var(--font-body);
            font-size: clamp(12px, 1.2vw, 15px);
            text-align: center;
            letter-spacing: 0.05em;
            transition: background-color 0.22s ease;
        }

        .version-card:hover .card-cta {
            background: var(--red-dark);
        }

        /* ============================================================
           七、页脚
           ============================================================ */
        .footer {
            position: relative;
            z-index: 2;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px clamp(12px, 2vw, 24px);
            padding: clamp(12px, 1.4vw, 18px) clamp(16px, 3vw, 36px);
            border-top: 1px solid var(--rule-dark);
            font-family: var(--font-body);
            font-size: clamp(11px, 1.1vw, 13px);
            color: var(--ink);
        }

        /* ============================================================
           八、无障碍：尊重系统「减少动态效果」偏好
           ============================================================ */
        @media (prefers-reduced-motion: reduce) {
            .version-card,
            .card-head,
            .card-cta {
                transition: none !important;
            }

            .version-card:hover {
                transform: none;
            }
        }
    </style>
</head>
