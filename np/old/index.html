<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#f5f2eb;
  --paper:#faf7ef;
  --paper-2:#f2ede2;
  --ink:#1a1714;
  --ink-soft:#2c2823;
  --red:#a3211e;
  --red-deep:#8a1a17;
  --red-bright:#c73530;
  --muted:#6d675a;
  --rule:#c9c2b0;
  --rule-2:#b8b0a0;
  --canvas:#d8d3c8;

  --radius:2px;
  --shadow-tip:0 4px 14px rgba(0,0,0,.22);
  --pad-x:clamp(12px,3vw,22px);

  --dur:.15s;
}

html{
  height:100%;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body{
  height:100vh;
  height:100dvh;
  overflow:hidden;
  font-family:"Noto Serif SC","Songti SC","SimSun","宋体",serif;
  background:var(--bg);
  color:var(--ink);
  display:flex;
  flex-direction:column;
  padding:
    env(safe-area-inset-top,0)
    env(safe-area-inset-right,0)
    env(safe-area-inset-bottom,0)
    env(safe-area-inset-left,0);
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overscroll-behavior:none;
}

/* ============ 顶栏 ============ */
.app-header{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:11px var(--pad-x);
  min-height:56px;
  background:linear-gradient(180deg,var(--paper) 0%,var(--paper-2) 100%);
  border-bottom:3px double var(--ink);
  overflow:hidden;
}
.app-header__brand{
  display:flex;
  align-items:baseline;
  gap:10px;
  flex:1 1 auto;
  min-width:0;
  overflow:hidden;
}
.app-header__title{
  font-size:clamp(14px,2.3vw,20px);
  font-weight:700;
  letter-spacing:.08em;
  color:var(--red);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  min-width:0;
}
.app-header__meta{
  font-size:clamp(11px,1.4vw,12px);
  color:var(--muted);
  white-space:nowrap;
  letter-spacing:.08em;
  flex:0 0 auto;
  opacity:.85;
}

.app-header__info{
  display:flex;
  align-items:center;
  gap:8px;
  flex:0 0 auto;
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.app-header__ver{
  display:inline-flex;
  align-items:center;
  padding:2px 8px;
  background:var(--red);
  color:#fff;
  font-size:clamp(11px,1.4vw,13px);
  font-weight:700;
  letter-spacing:.06em;
  border-radius:var(--radius);
  line-height:1.5;
}
.app-header__time{
  font-size:clamp(10px,1.3vw,12.5px);
  color:var(--ink-soft);
  letter-spacing:.02em;
}
.app-header__time--short{display:inline}
.app-header__time--full{display:none}
@media (min-width:720px){
  .app-header__time--short{display:none}
  .app-header__time--full{display:inline}
}

/* ============ 时间轴面板 ============ */
.timeline-panel{
  flex:0 0 auto;
  background:var(--paper);
  border-bottom:1px solid var(--rule);
  padding:12px var(--pad-x) 14px;
  display:flex;
  flex-direction:column;
  gap:10px;
  min-width:0;
  box-shadow:0 1px 3px rgba(26,23,20,.04);
}

/* ============ 时间轴轨道 ============ */
/* 关键：左右负 margin，抵消 panel 的 padding，让轨道贯穿屏幕横向 */
.tl-track-wrap{
  position:relative;
  padding:8px 0 0;
  min-width:0;
  margin-left:calc(-1 * var(--pad-x));
  margin-right:calc(-1 * var(--pad-x));
}

.tl-track{
  position:relative;
  height:52px;
  border-radius:0;            /* 贯穿屏幕后不再需要圆角 */
  background:
    linear-gradient(180deg,
      rgba(250,247,239,.9) 0%,
      rgba(242,237,226,.85) 50%,
      rgba(250,247,239,.9) 100%);
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
  overflow:hidden;
  box-shadow:
    inset 0 0 0 1px rgba(26,23,20,.06),
    inset 0 1px 2px rgba(26,23,20,.05);
}
.tl-track.is-scrubbing{cursor:grabbing}
.tl-track.is-resizing .tl-progress{transition:none}

/* 日期分组色带 */
.tl-band{
  position:absolute;
  top:0;
  bottom:0;
  background:rgba(163,33,30,.035);
  border-left:1px solid rgba(26,23,20,.05);
  pointer-events:none;
  z-index:0;
}
.tl-band.is-alt{
  background:rgba(109,103,90,.05);
}

/* 基线（虚线）：从屏幕左边缘到右边缘 */
.tl-baseline{
  position:absolute;
  top:50%;
  left:0;
  right:0;
  height:1.5px;
  transform:translateY(-1px);
  background:repeating-linear-gradient(90deg,
    var(--rule-2) 0 3px,
    transparent 3px 7px);
  pointer-events:none;
  z-index:1;
}

/* 进度线：同样从屏幕左边缘开始 */
.tl-progress{
  position:absolute;
  top:50%;
  left:0;
  width:0;
  height:2px;
  transform:translateY(-1px);
  background:linear-gradient(90deg,var(--red) 0%,var(--red-bright) 100%);
  box-shadow:0 0 6px rgba(163,33,30,.35);
  pointer-events:none;
  z-index:2;
  transition:width .25s ease;
}

/* 版本圆点 */
.tl-marker{
  position:absolute;
  top:50%;
  width:var(--ms,14px);
  height:var(--ms,14px);
  margin-top:calc(var(--ms,14px) / -2);
  margin-left:calc(var(--ms,14px) / -2);
  border-radius:50%;
  background:var(--paper);
  border:1.5px solid var(--rule-2);
  cursor:pointer;
  z-index:3;
  box-shadow:
    0 1px 2px rgba(26,23,20,.08),
    inset 0 1px 0 rgba(255,255,255,.9);
  transition:
    background var(--dur),
    border-color var(--dur),
    box-shadow var(--dur),
    transform var(--dur);
  -webkit-tap-highlight-color:transparent;
  will-change:transform;
}
.tl-marker:hover{
  border-color:var(--red);
  box-shadow:
    0 0 0 4px rgba(163,33,30,.12),
    0 1px 2px rgba(26,23,20,.08),
    inset 0 1px 0 rgba(255,255,255,.9);
}
.tl-marker.is-active{
  background:var(--red);
  border-color:var(--red);
  box-shadow:
    0 0 0 2.5px var(--paper),
    0 0 0 5px rgba(163,33,30,.28),
    0 2px 6px rgba(163,33,30,.35);
  z-index:5;
}

/* ============ 日期标尺（与轨道同样贯穿屏幕） ============ */
.tl-ruler{
  position:relative;
  height:18px;
  margin-top:6px;
  min-width:0;
  overflow:hidden;
  pointer-events:none;
}
.tl-ruler__item{
  position:absolute;
  top:0;
  bottom:0;
  display:flex;
  align-items:center;
  padding:0 8px;
  font-size:10.5px;
  line-height:1;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  border-left:1px solid var(--rule-2);
  font-variant-numeric:tabular-nums;
  letter-spacing:.04em;
}
.tl-ruler__item.is-first{border-left:none}

/* ============ 操作行（保持内缩） ============ */
.tl-actions{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

/* 预加载状态 */
.tl-preload{
  display:flex;
  align-items:center;
  gap:6px;
  margin-left:auto;
  font-size:clamp(10px,1.3vw,11.5px);
  color:var(--muted);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  flex:0 1 auto;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  letter-spacing:.04em;
  transition:opacity .6s ease;
}
.tl-preload.is-done{opacity:0;pointer-events:none}
.tl-preload__dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--red);
  animation:pulse 1.2s ease-in-out infinite;
  flex:0 0 auto;
}
@keyframes pulse{
  0%,100%{opacity:.25;transform:scale(.9)}
  50%{opacity:1;transform:scale(1.1)}
}

/* ============ 按钮 ============ */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  min-width:38px;
  min-height:38px;
  padding:0 14px;
  border:1.5px solid var(--ink);
  border-radius:var(--radius);
  background:var(--paper);
  color:var(--ink);
  font-family:inherit;
  font-size:13px;
  font-weight:500;
  letter-spacing:.05em;
  line-height:1;
  cursor:pointer;
  transition:
    background var(--dur) ease,
    color var(--dur) ease,
    border-color var(--dur) ease,
    transform var(--dur) ease,
    box-shadow var(--dur) ease;
  -webkit-tap-highlight-color:transparent;
  outline:none;
  touch-action:manipulation;
}
.btn:hover{
  background:var(--ink);
  color:var(--paper);
  border-color:var(--ink);
  transform:translateY(-1px);
  box-shadow:0 3px 8px rgba(26,23,20,.18);
}
.btn:active{
  transform:translateY(0) scale(.97);
  box-shadow:none;
}
.btn:focus-visible{
  outline:2px solid var(--red);
  outline-offset:2px;
}
.btn--icon{
  width:38px;
  min-width:38px;
  padding:0;
  font-size:17px;
  font-weight:400;
  line-height:1;
}
.btn--play{
  width:44px;
  height:44px;
  min-width:44px;
  min-height:44px;
  padding:0;
  border-radius:50%;
  background:var(--red);
  color:#fff;
  border-color:var(--red);
  font-size:15px;
  box-shadow:
    0 2px 8px rgba(163,33,30,.35),
    inset 0 1px 0 rgba(255,255,255,.22);
}
.btn--play:hover{
  background:var(--red-deep);
  border-color:var(--red-deep);
  color:#fff;
  box-shadow:
    0 4px 14px rgba(163,33,30,.45),
    inset 0 1px 0 rgba(255,255,255,.22);
}

/* ============ 预览视口 ============ */
.viewer{
  position:relative;
  flex:1 1 0;
  min-height:0;
  min-width:0;
  background:var(--canvas);
  overflow:hidden;
}
.viewer__frame{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:none;
  background:var(--canvas);
  opacity:0;
  pointer-events:none;
  transition:opacity .12s ease;
  z-index:1;
}
.viewer__frame.is-active{
  opacity:1;
  pointer-events:auto;
  z-index:2;
}
.viewer__hint{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  font-size:13px;
  color:var(--muted);
  letter-spacing:.1em;
  background:var(--canvas);
  z-index:10;
  transition:opacity .3s ease;
}
.viewer__hint.is-hidden{
  opacity:0;
  pointer-events:none;
}
.viewer__hint::after{
  content:"";
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--red);
  animation:pulse 1.1s ease-in-out infinite;
}

/* ============ 全局 tooltip ============ */
.global-tip{
  position:fixed;
  top:0;
  left:0;
  z-index:2147483647;
  padding:6px 10px;
  font-family:inherit;
  font-size:12px;
  line-height:1.35;
  letter-spacing:.03em;
  color:var(--paper);
  background:var(--ink-soft);
  border-radius:3px;
  white-space:nowrap;
  box-shadow:var(--shadow-tip);
  font-variant-numeric:tabular-nums;
  pointer-events:none;
  opacity:0;
  visibility:hidden;
  transition:opacity .12s ease;
  will-change:top,left,opacity;
}
.global-tip::after{
  content:"";
  position:absolute;
  left:50%;
  bottom:-4px;
  width:8px;
  height:8px;
  margin-left:-4px;
  background:var(--ink-soft);
  transform:rotate(45deg);
}
.global-tip.is-visible{
  opacity:1;
  visibility:visible;
}
.global-tip.is-below::after{
  bottom:auto;
  top:-4px;
}

/* ============ 响应式：紧凑横屏 ============ */
@media (orientation:landscape) and (max-height:520px){
  .app-header{
    min-height:0;
    padding:6px var(--pad-x);
    border-bottom-width:2px;
  }
  .app-header__title{font-size:13px}
  .app-header__meta{font-size:10px}
  .app-header__ver{padding:1px 6px;font-size:10.5px}
  .app-header__time{font-size:10px}
  .timeline-panel{padding:6px var(--pad-x) 8px;gap:6px}
  .tl-track-wrap{padding:6px 0 0}
  .tl-ruler{height:14px;margin-top:4px}
  .tl-ruler__item{font-size:9px;padding:0 5px}
  .btn--play{width:36px;height:36px;min-width:36px;min-height:36px;font-size:13px}
  .btn--icon{width:32px;min-width:32px;min-height:32px;font-size:15px}
  .btn{min-height:32px;padding:0 10px}
}

/* ============ 响应式：极窄屏 ============ */
@media (max-width:360px){
  .app-header__meta{display:none}
  .app-header__info{gap:5px}
  .tl-ruler__item{padding:0 4px;font-size:9px}
  .tl-actions{gap:5px}
  .btn{padding:0 10px;font-size:12px}
  .btn--play{width:40px;height:40px;min-width:40px;min-height:40px}
  .global-tip{font-size:11px;padding:5px 8px}
}

/* ============ 偏好减弱动画 ============ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
}

/* ============ 无 JS 提示 ============ */
.noscript{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  text-align:center;
  font-size:14px;
  color:var(--ink);
  background:var(--paper);
  z-index:9999;
}
</style>
</head>
<body>

<noscript>
  <div class="noscript">此页面需要启用 JavaScript 才能浏览版本时间轴。</div>
</noscript>

<header class="app-header">
  <div class="app-header__brand">
    <h1 class="app-header__title">语文5组的神秘报纸</h1>
    <span class="app-header__meta">版本时间轴</span>
  </div>

  <div class="app-header__info" aria-live="polite">
    <span class="app-header__ver" id="curVer">v0001</span>
    <span class="app-header__time app-header__time--short" id="curTimeShort">10/07 13:22</span>
    <span class="app-header__time app-header__time--full"  id="curTimeFull">2026年10月7日 13:22</span>
  </div>
</header>

<section class="timeline-panel" aria-label="版本时间轴">
  <div class="tl-track-wrap">
    <div class="tl-track" id="track" role="slider"
         aria-label="版本时间轴" aria-valuemin="0" aria-valuemax="42" aria-valuenow="0" tabindex="0">
      <div class="tl-baseline" aria-hidden="true"></div>
      <div class="tl-progress" id="progress" aria-hidden="true"></div>
    </div>
    <div class="tl-ruler" id="ruler" aria-hidden="true"></div>
  </div>

  <div class="tl-actions">
    <button class="btn btn--icon" id="prevBtn" type="button" aria-label="上一版" title="上一版（←）">‹</button>
    <button class="btn btn--play" id="playBtn" type="button" aria-label="播放" title="播放 / 暂停（空格）">▶</button>

</section>

<div class="global-tip" id="globalTip" role="tooltip" aria-hidden="true"></div>

<script src="timeline.js"></script>
</body>
