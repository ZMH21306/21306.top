<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="description" content="语文5组的神秘报纸——版本时间轴">
<meta name="theme-color" content="#cfc9bd">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>语文5组的神秘报纸 · 版本时间轴 | 21306.top/np/old</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#f5f2eb;
  --ink:#1a1714;
  --red:#a3211e;
  --muted:#6d675a;
  --rule:#c9c2b0;
  --paper:#faf7ef;
  --canvas:#d8d3c8;
  --shadow-sm:0 1px 3px rgba(0,0,0,.10);
  --shadow-md:0 2px 8px rgba(0,0,0,.14);
  --shadow-tip:0 4px 14px rgba(0,0,0,.20);
  --radius:4px;
  --pad-x:clamp(12px,3vw,22px);
  --gap-sm:6px;
  --gap-md:10px;
  --dur:.15s;
}

/* ============ 根布局 ============ */
html{
  height:100%;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body{
  height:100vh;
  height:100dvh;
  overflow:hidden;
  font-family:"Noto Serif SC","Songti SC","SimSun","宋体",serif;
  background:var(--bg);
  color:var(--ink);
  display:flex;
  flex-direction:column;
  padding:
    env(safe-area-inset-top,0)
    env(safe-area-inset-right,0)
    env(safe-area-inset-bottom,0)
    env(safe-area-inset-left,0);
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overscroll-behavior:none;
}

/* ============ 顶栏 ============ */
.app-header{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--gap-md);
  padding:10px var(--pad-x);
  min-height:52px;
  background:var(--paper);
  border-bottom:2px solid var(--ink);
  overflow:hidden;
}
.app-header__brand{
  display:flex;
  align-items:baseline;
  gap:var(--gap-md);
  flex:1 1 auto;
  min-width:0;
  overflow:hidden;
}
.app-header__title{
  font-size:clamp(14px,2.3vw,20px);
  font-weight:700;
  letter-spacing:.06em;
  color:var(--red);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  min-width:0;
}
.app-header__meta{
  font-size:clamp(11px,1.5vw,13px);
  color:var(--muted);
  white-space:nowrap;
  flex:0 0 auto;
}

/* ---- 右上角版本信息块 ---- */
.app-header__info{
  display:flex;
  align-items:baseline;
  gap:8px;
  flex:0 0 auto;
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
  min-width:0;
}
.app-header__ver{
  font-size:clamp(12px,1.6vw,15px);
  font-weight:700;
  color:var(--red);
  letter-spacing:.04em;
}
.app-header__time{
  font-size:clamp(10px,1.3vw,13px);
  color:var(--muted);
}
/* 默认显示短格式；宽屏切完整格式 */
.app-header__time--short{ display:inline; }
.app-header__time--full { display:none;   }
@media (min-width:640px){
  .app-header__time--short{ display:none;   }
  .app-header__time--full { display:inline; }
}

/* ============ 时间轴面板 ============ */
.timeline-panel{
  flex:0 0 auto;
  background:var(--paper);
  border-bottom:1px solid var(--rule);
  padding:10px var(--pad-x);
  display:flex;
  flex-direction:column;
  gap:var(--gap-md);
  min-width:0;
}

.tl-track-wrap{
  position:relative;
  padding:12px 0 2px;
  min-width:0;
}

/* 圆点轨道 */
.tl-track{
  position:relative;
  height:44px;
  border-radius:var(--radius);
  background:rgba(26,23,20,.02);
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
  overflow:hidden;
}
.tl-track.is-scrubbing{
  cursor:grabbing;
}
.tl-track.is-resizing .tl-progress{
  transition:none;
}

/* 日期分组背景色带 */
.tl-band{
  position:absolute;
  top:4px;
  bottom:4px;
  background:rgba(163,33,30,.05);
  border-left:1px solid rgba(26,23,20,.06);
  pointer-events:none;
  z-index:0;
}
.tl-band.is-alt{
  background:rgba(109,103,90,.055);
}

/* 基线（虚线） */
.tl-baseline{
  position:absolute;
  top:50%;
  left:9px;
  right:9px;
  height:2px;
  transform:translateY(-1px);
  background:repeating-linear-gradient(90deg,var(--rule) 0 4px,transparent 4px 8px);
  pointer-events:none;
  z-index:1;
}

/* 进度线（已缓存长度） */
.tl-progress{
  position:absolute;
  top:50%;
  left:9px;
  width:0;
  height:2px;
  transform:translateY(-1px);
  background:var(--red);
  pointer-events:none;
  z-index:2;
  transition:width .2s ease;
}

/* 版本圆点 */
.tl-marker{
  position:absolute;
  top:50%;
  width:var(--ms,14px);
  height:var(--ms,14px);
  margin-top:calc(var(--ms,14px) / -2);
  margin-left:calc(var(--ms,14px) / -2);
  border-radius:50%;
  background:var(--paper);
  border:1.5px solid var(--rule);
  cursor:pointer;
  z-index:3;
  transition:background var(--dur),border-color var(--dur),box-shadow var(--dur);
  -webkit-tap-highlight-color:transparent;
}
.tl-marker:hover{
  border-color:var(--red);
}
.tl-marker.is-active{
  background:var(--red);
  border-color:var(--red);
  box-shadow:0 0 0 3px rgba(163,33,30,.18);
  z-index:5;
}

/* ---- 独立日期标尺 ---- */
.tl-ruler{
  position:relative;
  height:16px;
  margin-top:4px;
  min-width:0;
  overflow:hidden;
  pointer-events:none;
}
.tl-ruler__item{
  position:absolute;
  top:0;
  bottom:0;
  display:flex;
  align-items:center;
  padding:0 5px;
  font-size:10px;
  line-height:1;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  border-left:1px solid var(--rule);
  font-variant-numeric:tabular-nums;
  letter-spacing:0;
}
.tl-ruler__item.is-first{
  border-left:none;
}

/* --- 底部操作行 --- */
.tl-actions{
  display:flex;
  align-items:center;
  gap:var(--gap-sm);
  min-width:0;
}

/* 预加载状态 */
.tl-preload{
  display:flex;
  align-items:center;
  gap:var(--gap-sm);
  margin-left:auto;
  font-size:clamp(10px,1.3vw,12px);
  color:var(--muted);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  flex:0 1 auto;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  transition:opacity .5s ease;
}
.tl-preload.is-done{
  opacity:0;
  pointer-events:none;
}
.tl-preload__dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--red);
  animation:pulse 1.2s ease-in-out infinite;
  flex:0 0 auto;
}
@keyframes pulse{
  0%,100%{opacity:.2}
  50%{opacity:1}
}

/* ============ 按钮 ============ */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  min-width:36px;
  min-height:36px;
  padding:0 12px;
  border:1px solid var(--rule);
  border-radius:var(--radius);
  background:var(--paper);
  color:var(--ink);
  font-family:inherit;
  font-size:13px;
  line-height:1;
  cursor:pointer;
  transition:background var(--dur),color var(--dur),border-color var(--dur),transform var(--dur);
  -webkit-tap-highlight-color:transparent;
  outline:none;
  touch-action:manipulation;
}
.btn:hover{
  background:var(--ink);
  color:var(--paper);
  border-color:var(--ink);
}
.btn:active{
  transform:scale(.94);
}
.btn:focus-visible{
  outline:2px solid var(--red);
  outline-offset:2px;
}
.btn--icon{
  width:36px;
  min-width:36px;
  padding:0;
  font-size:16px;
  line-height:1;
}
.btn--play{
  width:42px;
  height:42px;
  min-width:42px;
  min-height:42px;
  padding:0;
  border-radius:50%;
  background:var(--red);
  color:var(--paper);
  border-color:var(--red);
  font-size:15px;
}
.btn--play:hover{
  background:var(--ink);
  border-color:var(--ink);
  color:var(--paper);
}

/* ============ 预览视口 ============ */
.viewer{
  position:relative;
  flex:1 1 0;
  min-height:0;
  min-width:0;
  background:var(--canvas);
  overflow:hidden;
}
.viewer__frame{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:none;
  background:var(--canvas);
  opacity:0;
  pointer-events:none;
  transition:opacity .12s ease;
  z-index:1;
}
.viewer__frame.is-active{
  opacity:1;
  pointer-events:auto;
  z-index:2;
}
.viewer__hint{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  color:var(--muted);
  background:var(--canvas);
  z-index:10;
  transition:opacity .3s ease;
}
.viewer__hint.is-hidden{
  opacity:0;
  pointer-events:none;
}

/* ============ 全局浮层提示（最顶层） ============ */
.global-tip{
  position:fixed;
  top:0;
  left:0;
  z-index:2147483647;
  padding:5px 9px;
  font-family:inherit;
  font-size:12px;
  line-height:1.3;
  color:var(--red);
  background:var(--paper);
  border:1px solid var(--rule);
  border-radius:3px;
  white-space:nowrap;
  box-shadow:var(--shadow-tip);
  font-variant-numeric:tabular-nums;
  pointer-events:none;
  opacity:0;
  visibility:hidden;
  transition:opacity .12s ease;
  will-change:top,left,opacity;
}
.global-tip.is-visible{
  opacity:1;
  visibility:visible;
}

/* ============ 响应式：紧凑横屏 ============ */
@media (orientation:landscape) and (max-height:520px){
  .app-header{
    min-height:0;
    padding:6px var(--pad-x);
    border-bottom-width:1px;
  }
  .app-header__title{font-size:13px}
  .app-header__meta {font-size:10px}
  .app-header__ver  {font-size:11px}
  .app-header__time {font-size:10px}
  .timeline-panel{padding:6px var(--pad-x);gap:6px}
  .tl-track-wrap{padding:8px 0 2px}
  .btn--play{width:34px;height:34px;min-width:34px;min-height:34px}
  .btn--icon{width:30px;min-width:30px;min-height:30px}
  .btn{min-height:30px}
  .tl-ruler{height:14px}
  .tl-ruler__item{font-size:9px}
}

/* ============ 响应式：极窄屏 ============ */
@media (max-width:360px){
  .app-header__meta{display:none}
  .app-header__info{gap:5px}
  .tl-ruler__item{padding:0 3px;font-size:9px}
  .global-tip{font-size:11px;padding:4px 7px}
}

/* ============ 偏好减弱动画 ============ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
}

/* ============ 无 JS 提示 ============ */
.noscript{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  text-align:center;
  font-size:14px;
  color:var(--ink);
  background:var(--paper);
  z-index:9999;
}
</style>
</head>
<body>

<noscript>
  <div class="noscript">此页面需要启用 JavaScript 才能浏览版本时间轴。</div>
</noscript>

<header class="app-header">
  <div class="app-header__brand">
    <h1 class="app-header__title">语文5组的神秘报纸</h1>
    <span class="app-header__meta">版本时间轴</span>
  </div>

  <!-- 右上角：当前查看的版本号 + 时间点 -->
  <div class="app-header__info" aria-live="polite">
    <span class="app-header__ver" id="curVer">v0001</span>
    <span class="app-header__time app-header__time--short" id="curTimeShort">10/07 13:22</span>
    <span class="app-header__time app-header__time--full"  id="curTimeFull">2026年10月7日 13:22</span>
  </div>
</header>

<section class="timeline-panel" aria-label="版本时间轴">
  <div class="tl-track-wrap">
    <div class="tl-track" id="track" role="slider"
         aria-label="版本时间轴" aria-valuemin="0" aria-valuemax="42" aria-valuenow="0" tabindex="0">
      <div class="tl-baseline" aria-hidden="true"></div>
      <div class="tl-progress" id="progress" aria-hidden="true"></div>
    </div>
    <!-- 日期标尺：独立行，永不与圆点重叠 -->
    <div class="tl-ruler" id="ruler" aria-hidden="true"></div>
  </div>

  <div class="tl-actions">
    <button class="btn btn--icon" id="prevBtn" type="button" aria-label="上一版" title="上一版（←）">‹</button>
    <button class="btn btn--play" id="playBtn" type="button" aria-label="播放" title="播放 / 暂停（空格）">▶</button>
    <button class="btn btn--icon" id="nextBtn" type="button" aria-label="下一版" title="下一版（→）">›</button>
    <span class="tl-preload" id="preloadInfo">
      <span class="tl-preload__dot" aria-hidden="true"></span>
      <span id="preloadText">预加载 1 / 43</span>
    </span>
  </div>
</section>

<section class="viewer" id="viewer" aria-label="版本预览">
  <div class="viewer__hint" id="viewerHint">正在载入…</div>
</section>

<!-- 全局浮层：任何悬浮提示都显示在此，永不裁剪 -->
<div class="global-tip" id="globalTip" role="tooltip" aria-hidden="true"></div>

<script src="timeline.js"></script>
</body>
</html>
