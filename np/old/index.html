<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>校园日报 · 版本时间轴</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f2eb;--ink:#1a1714;--red:#a3211e;--muted:#6d675a;--rule:#c9c2b0;--paper:#faf7ef}
html,body{height:100%;overflow:hidden}
body{font-family:"Noto Serif SC","SimSun","宋体",serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;touch-action:none}
.header{padding:12px 20px;background:var(--paper);border-bottom:2px solid var(--ink);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;min-height:52px}
.header-title{font-size:clamp(14px,3vw,20px);font-weight:bold;letter-spacing:2px;color:var(--red)}
.header-meta{font-size:12px;color:var(--muted);white-space:nowrap;margin-left:12px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}

/* ===== 时间轴（顶部） ===== */
.timeline-bar{background:var(--paper);border-bottom:1px solid var(--rule);padding:12px clamp(12px,3vw,20px) 10px;flex-shrink:0}
.tl-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
.tl-current{display:flex;align-items:baseline;gap:10px;min-width:0;overflow:hidden}
.tl-id{font-size:clamp(14px,2.5vw,16px);font-weight:bold;color:var(--red);letter-spacing:1px;flex-shrink:0}
.tl-time{font-size:clamp(11px,2vw,13px);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-count{font-size:clamp(10px,1.8vw,11px);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
.tl-preload{font-size:clamp(10px,1.8vw,11px);color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;transition:opacity .5s ease}
.tl-preload .dot{width:6px;height:6px;border-radius:50%;background:var(--red);animation:tlpulse 1.2s ease-in-out infinite;flex-shrink:0}
.tl-preload.done{opacity:0}
@keyframes tlpulse{0%,100%{opacity:.2}50%{opacity:1}}

.timeline-track{position:relative;cursor:pointer;user-select:none;touch-action:none;overflow:hidden;border-radius:3px;background:rgba(26,23,20,.02)}
.timeline-track.scrubbing{cursor:grabbing}
.tl-band{position:absolute;top:0;bottom:0;z-index:0;background:rgba(163,33,30,.05);border-left:1px solid rgba(26,23,20,.07)}
.tl-band.alt{background:rgba(109,103,90,.055)}
.tl-band-label{position:absolute;top:3px;left:6px;font-size:10px;color:var(--muted);white-space:nowrap;letter-spacing:.5px;overflow:hidden;text-overflow:ellipsis}
.tl-band-label.right{left:auto;right:6px;text-align:right}
.tl-baseline{position:absolute;top:50%;left:9px;right:9px;height:2px;background:repeating-linear-gradient(90deg,var(--rule) 0 5px,transparent 5px 10px);transform:translateY(-50%);z-index:1}
.tl-progress{position:absolute;top:50%;left:9px;width:0;height:2px;background:var(--red);transform:translateY(-50%);transition:width .15s ease;z-index:2}
.tl-marker{position:absolute;top:50%;transform:translateY(-50%);cursor:pointer;transition:opacity .15s}
.tl-marker::after{content:"";position:absolute;border-radius:50%;background:var(--paper);border:1.5px solid var(--rule);width:var(--ms,18px);height:var(--ms,18px);margin:calc(var(--ms,18px) / -2) 0 0 calc(var(--ms,18px) / -2);transition:background .14s,border-color .14s,width .14s,height .14s,margin .14s,box-shadow .14s}
.tl-marker:hover::after{border-color:var(--red)}
.tl-marker.active::after{background:var(--red);border-color:var(--red);width:calc(var(--ms,18px) * 1.44);height:calc(var(--ms,18px) * 1.44);margin:calc(var(--ms,18px) * -0.36) 0 0 calc(var(--ms,18px) * -0.36);box-shadow:0 0 0 3px rgba(163,33,30,.18)}
.timeline-track.resizing .tl-progress{transition:none}
.tl-tip{position:absolute;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap;opacity:0;transition:opacity .14s;pointer-events:none;z-index:10;background:var(--paper);padding:2px 6px;border-radius:2px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.tl-marker:hover .tl-tip,.tl-marker.active .tl-tip{opacity:1;color:var(--red)}

.tl-foot{display:flex;align-items:center;gap:12px;margin-top:8px}
.tl-controls{display:flex;align-items:center;gap:6px}
.btn{padding:4px 12px;border:1px solid var(--rule);background:var(--paper);cursor:pointer;font-size:12px;font-family:inherit;color:var(--ink);transition:background .15s,color .15s,border-color .15s;-webkit-tap-highlight-color:transparent;outline:none}
.btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn:active{transform:scale(.95)}
.btn-play{width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:14px;line-height:1}
.btn-primary{background:var(--red);color:var(--paper);border-color:var(--red)}
.btn-primary:hover{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tl-hint{margin-left:auto;font-size:clamp(9px,1.5vw,11px);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== 版本视口 ===== */
.viewer{position:relative;flex:1;min-height:0;background:#d8d3c8;overflow:hidden}
.viewer .frame{position:absolute;top:0;left:0;width:100%;height:100%;border:none;display:block;background:#d8d3c8;opacity:0;pointer-events:none;transition:opacity .1s ease;z-index:1}
.viewer .frame.active{opacity:1;pointer-events:auto;z-index:2}
.viewer-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);background:#d8d3c8;z-index:3;transition:opacity .3s ease}
.viewer-hint.hidden{opacity:0;pointer-events:none}
</style>
</head>
<body>
<header class="header">
  <div style="display:flex;align-items:center;overflow:hidden">
    <div class="header-title">语文5组的神秘报纸</div>
    <div class="header-meta">版本时间轴</div>
  </div>
</header>
<div class="main">
<div class="timeline-bar">
<div class="tl-head">
<div class="tl-current">
<span class="tl-id" id="curVer">v0001</span>
<span class="tl-time" id="curTime">2026年10月7日 13:22</span>
<span class="tl-count" id="curCount">第 1 / 43 版</span>
</div>
<div class="tl-preload" id="preloadInfo"><span class="dot"></span><span id="preloadText">后台预加载 1 / 43</span></div>
</div>
<div class="timeline-track" id="track">
<div class="tl-baseline"></div>
<div class="tl-progress" id="progress"></div>
</div>
<div class="tl-foot">
<div class="tl-controls">
<button class="btn btn-play btn-primary" id="playBtn" title="播放 / 暂停（空格）">▶</button>
</div>
<div class="tl-hint">拖动轨道快速定位 · ←/→ 切换 · 空格播放 · Home/End 首尾</div>
</div>
</div>
<div class="viewer" id="viewer">
<div class="viewer-hint" id="viewerHint">正在载入…</div>
</div>
</div>
<script src="timeline.js"></script>
</body>
</html>
