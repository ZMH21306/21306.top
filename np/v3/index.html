<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语文5组的神秘报纸 · 第三版</title>
    <style>
        :root {
            --ink: #16130f; --ink-soft: #3c3730; --paper: #faf7ef; --rule: #c9c2b0;
            --rule-dark: #16130f; --muted: #6d675a; --red: #a3211e;
            --font-body: Georgia, "Nimbus Roman", "SimSun", "宋体", serif;
            --font-title: "Times New Roman", "SimHei", "黑体", sans-serif;
            --font-sub: "KaiTi", "楷体", serif;
        }
        html {background:#d8d3c8;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
        body {font-family:var(--font-body);background:#d8d3c8;color:var(--ink);margin:0;padding:0}
        .paper-outer {width:100vw;height:calc(100vw * 210 / 297);overflow:hidden;position:relative;background:#d8d3c8}
        .sheet {width:297mm;height:210mm;padding:3mm 4mm 2mm;background:var(--paper);position:relative;overflow:hidden;display:flex;flex-direction:column;transform-origin:top left}
        .header {height:12mm;display:flex;align-items:center;padding:0 4mm;border-bottom:1px solid var(--rule-dark);position:relative;z-index:2}
        .header::before {content:"";position:absolute;inset:0;border-top:3mm solid var(--red);z-index:-1}
        .header-content {display:flex;align-items:center;width:100%}
        .header-logo {font-size:5mm;font-weight:bold;color:var(--red);letter-spacing:-0.5px;margin-right:8mm;font-family:var(--font-title)}
        .header-title {font-size:4mm;font-weight:bold;color:var(--ink);flex-grow:1;margin-right:4mm;font-family:var(--font-title)}
        .header-date {font-size:2.5mm;color:var(--ink-soft);white-space:nowrap;font-family:var(--font-body)}
        .main {flex:1 1 auto;overflow-y:auto;padding-right:2mm;position:relative;display:flex;align-items:center;justify-content:center}
        .version-info {text-align:center;max-width:120mm;padding:10mm;border:1px solid var(--rule);background:var(--paper);border-radius:2mm;margin:10mm}
        .version-number {font-size:8mm;font-weight:bold;color:var(--red);margin-bottom:4mm;font-family:var(--font-title)}
        .version-name {font-size:4mm;font-weight:bold;color:var(--ink);margin-bottom:2mm;font-family:var(--font-title)}
        .version-description {font-size:2.8mm;color:var(--ink-soft);margin-bottom:4mm;font-family:var(--font-sub)}
        .back-link {display:inline-block;padding:2mm 4mm;background:var(--red);color:white;text-decoration:none;font-size:2.8mm;border-radius:1mm;font-family:var(--font-body)}
        .back-link:hover {background:#8b1a18}
        .footer {height:8mm;display:flex;align-items:center;justify-content:center;border-top:1px solid var(--rule-dark);position:relative;z-index:2;margin-top:auto}
        .footer-content {display:flex;gap:8mm;font-size:2.2mm;color:var(--ink);font-family:var(--font-body)}
    </style>
</head>
<body>
    <div class="paper-outer">
        <div class="sheet" id="paper-sheet">
            <header class="header">
                <div class="header-content">
                    <div class="header-logo">报</div>
                    <div class="header-title">语文5组的神秘报纸</div>
                    <div class="header-date">2026年10月7日</div>
                </div>
            </header>

            <main class="main">
                <div class="version-info">
                    <div class="version-number">第三版</div>
                    <div class="version-name">语文5组的神秘报纸</div>
                    <div class="version-description">这是神秘报纸的第三版内容</div>
                    <a href="../index.html" class="back-link">返回索引</a>
                </div>
            </main>

            <footer class="footer">
                <div class="footer-content">
                    <span>语文5组的神秘报纸</span>
                    <span>第三版</span>
                </div>
            </footer>
        </div>
    </div>

    <script>
        (function () {
            var sheet = document.getElementById('paper-sheet');
            if (!sheet) return;
            var lastWidth = 0, rafId = null;
            function applyZoom() {
                var naturalW = sheet.offsetWidth;
                if (!naturalW) return;
                var vw = document.documentElement.clientWidth;
                if (vw === lastWidth) return;
                lastWidth = vw;
                sheet.style.zoom = (vw / naturalW);
            }
            function scheduleFit() {
                if (rafId) return;
                rafId = requestAnimationFrame(function () {
                    rafId = null;
                    applyZoom();
                });
            }
            window.addEventListener('resize', scheduleFit);
            window.addEventListener('orientationchange', scheduleFit);
            applyZoom();
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(function () {
                    lastWidth = 0;
                    applyZoom();
                });
            }
        })();
    </script>
</body>
</html>
